server:
  port: ${PORT:5500}

spring:
  application:
    name: bill-pilot
  data:
    mongodb:
      uri: ${DB_URI:mongodb://localhost:27017/bill-pilot}
      database: ${DB_NAME:test}
      # Indexes are ensured by MongoIndexInitializer (tolerant of pre-existing, differently named indexes)
      auto-index-creation: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${EMAIL_USER:lymo.network@gmail.com}
    password: ${EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:100}
    refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:20}
    refill-duration-seconds: ${RATE_LIMIT_REFILL_DURATION:10}
    # Stricter per-IP limit for /api/v1/auth/** (sign-in / sign-up brute-force protection)
    auth-capacity: ${RATE_LIMIT_AUTH_CAPACITY:10}
    auth-refill-tokens: ${RATE_LIMIT_AUTH_REFILL_TOKENS:5}
    auth-refill-duration-seconds: ${RATE_LIMIT_AUTH_REFILL_DURATION:60}
    # Only enable when running behind a reverse proxy that overwrites X-Forwarded-For
    trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:false}
  cors:
    # Comma-separated list of origins allowed to call the API from a browser
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  workflow:
    # Shared secret for POST /api/v1/workflows/**; the endpoint is disabled while this is empty
    token: ${WORKFLOW_TOKEN:}
  mail:
    sender-email: ${EMAIL_USER:lymo.network@gmail.com}
    sender-name: "The Bill Pilot Team"
